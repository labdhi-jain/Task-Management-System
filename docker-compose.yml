version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: taskflow_mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskflow_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/task_management_db
      - JWT_SECRET=production_super_secret_jwt_key_2026_antigravity
      - JWT_REFRESH_SECRET=production_super_secret_refresh_jwt_key_2026_antigravity
      - JWT_EXPIRE=15m
      - JWT_REFRESH_EXPIRE=7d
    depends_on:
      - mongodb
    networks:
      - taskflow_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow_frontend
    restart: always
    ports:
      - '80:80'
      - '3000:80'
    depends_on:
      - backend
    networks:
      - taskflow_network

volumes:
  mongodb_data:

networks:
  taskflow_network:
    driver: bridge
